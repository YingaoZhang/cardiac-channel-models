[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-channel-models"
version = "0.1.0"
description = "Three-channel cardiac ion-channel XGBoost baselines and agent system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "rdkit>=2023.9",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "langgraph>=0.2",
  "langchain-openai>=1.0",
  "pypdf>=5.0",
  "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
